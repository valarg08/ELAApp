<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-label="An absolute-value inequality |x − 3| ≤ 5 as the closed segment from −2 to 8, because x is within 5 of 3.">
