<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-label="Even and odd functions. On the left an even function is mirror symmetric about the y-axis, with f(−2) = f(2). On the right an odd function has point symmetry about the origin, with f(−2) the opposite of f(2).">
