<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-label="Alternate angles are on opposite sides of the transversal. Alternate interior angles 3 and 6 are equal, and so are 4 and 5. Alternate exterior angles 1 and 8 are equal, and so are 2 and 7.">
<title>Alternate angles are on opposite sides of the transversal. Alternate interior angles 3 and 6 are equal, and so are 4 and 5. Alternate exterior angles 1 and 8 are equal, and so are 2 and 7.</title>
<style>
text{font:15px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#334155}
.t{font-weight:700;font-size:17px}
.s{font-size:13px;fill:#64748b}
.big{font-size:22px;font-weight:700}
.n{font-size:14px;font-weight:700}
.m{text-anchor:middle}
.a{fill:#0f766e;font-weight:700}
.o{fill:#c2410c;font-weight:700}
.b{fill:#1d4ed8;font-weight:700}
.ln{stroke:#334155;stroke-width:2.5;fill:none;stroke-linecap:round}
.th{stroke:#2563eb;stroke-width:2.5;fill:none;stroke-linecap:round}
.ar{stroke:#334155;stroke-width:1.8;fill:none}
.wa{fill:#0d9488;fill-opacity:.35}
.wo{fill:#ea580c;fill-opacity:.32}
.wb{fill:#2563eb;fill-opacity:.25}
.box{fill:none;stroke:#64748b;stroke-width:1.5}
.sh{fill:#e2e8f0;fill-opacity:.0;stroke:#334155;stroke-width:2.5;stroke-linejoin:round}
@media (prefers-color-scheme:dark){
text{fill:#e2e8f0}.s{fill:#94a3b8}.a{fill:#5eead4}.o{fill:#fdba74}.b{fill:#93c5fd}
.ln,.ar,.sh{stroke:#e2e8f0}.box{stroke:#94a3b8}.th{stroke:#93c5fd}
}
</style>
<text x="20" y="28" class="t">Alternate angles are equal</text><line x1="40" y1="70" x2="470" y2="70" class="ln"/><line x1="40" y1="165" x2="470" y2="165" class="ln"/><line x1="365.2" y1="32" x2="274.3" y2="203" class="th"/><path d="M450 64 L458 70 L450 76" class="ar"/><path d="M450 159 L458 165 L450 171" class="ar"/><path d="M344.9903432880895 70 L359.1 43.5 A30 30 0 0 0 315.0 70.0 Z" class="wo"/><text x="322.3" y="37.3" class="n m">1</text><text x="382.7" y="52.3" class="n m">2</text><path d="M344.9903432880895 70 L315.0 70.0 A30 30 0 0 0 330.9 96.5 Z" class="wa"/><text x="307.3" y="97.7" class="n m">3</text><text x="367.7" y="112.7" class="n m">4</text><text x="271.8" y="132.3" class="n m">5</text><path d="M294.477947280249 165 L324.5 165.0 A30 30 0 0 0 308.6 138.5 Z" class="wa"/><text x="332.2" y="147.3" class="n m">6</text><text x="256.8" y="192.7" class="n m">7</text><path d="M294.477947280249 165 L280.4 191.5 A30 30 0 0 0 324.5 165.0 Z" class="wo"/><text x="317.1" y="207.7" class="n m">8</text><text x="500" y="112" class="a">∠3 = ∠6</text><text x="500" y="130" class="a">∠4 = ∠5</text><text x="500" y="62" class="o">∠1 = ∠8</text><text x="500" y="80" class="o">∠2 = ∠7</text><text x="20" y="238" class="s">Opposite sides of the transversal: alternate interior (inside) and alternate exterior (outside).</text>
</svg>
