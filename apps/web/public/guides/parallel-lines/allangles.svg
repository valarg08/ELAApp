<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-label="With a transversal and parallel lines, the eight angles take only two values. If one angle is 50 degrees, the four angles 2, 3, 6 and 7 are 50 degrees and the other four are 130 degrees.">
<title>With a transversal and parallel lines, the eight angles take only two values. If one angle is 50 degrees, the four angles 2, 3, 6 and 7 are 50 degrees and the other four are 130 degrees.</title>
<style>
text{font:15px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#334155}
.t{font-weight:700;font-size:17px}
.s{font-size:13px;fill:#64748b}
.big{font-size:22px;font-weight:700}
.n{font-size:14px;font-weight:700}
.m{text-anchor:middle}
.a{fill:#0f766e;font-weight:700}
.o{fill:#c2410c;font-weight:700}
.b{fill:#1d4ed8;font-weight:700}
.ln{stroke:#334155;stroke-width:2.5;fill:none;stroke-linecap:round}
.th{stroke:#2563eb;stroke-width:2.5;fill:none;stroke-linecap:round}
.ar{stroke:#334155;stroke-width:1.8;fill:none}
.wa{fill:#0d9488;fill-opacity:.35}
.wo{fill:#ea580c;fill-opacity:.32}
.wb{fill:#2563eb;fill-opacity:.25}
.box{fill:none;stroke:#64748b;stroke-width:1.5}
.sh{fill:#e2e8f0;fill-opacity:.0;stroke:#334155;stroke-width:2.5;stroke-linejoin:round}
@media (prefers-color-scheme:dark){
text{fill:#e2e8f0}.s{fill:#94a3b8}.a{fill:#5eead4}.o{fill:#fdba74}.b{fill:#93c5fd}
.ln,.ar,.sh{stroke:#e2e8f0}.box{stroke:#94a3b8}.th{stroke:#93c5fd}
}
</style>
<text x="20" y="28" class="t">Only two values: 50° and 130°</text><line x1="40" y1="70" x2="470" y2="70" class="ln"/><line x1="40" y1="165" x2="470" y2="165" class="ln"/><line x1="365.2" y1="32" x2="274.3" y2="203" class="th"/><path d="M450 64 L458 70 L450 76" class="ar"/><path d="M450 159 L458 165 L450 171" class="ar"/><path d="M344.9903432880895 70 L359.1 43.5 A30 30 0 0 0 315.0 70.0 Z" class="wo"/><text x="322.3" y="37.3" class="n m">130°</text><path d="M344.9903432880895 70 L375.0 70.0 A30 30 0 0 0 359.1 43.5 Z" class="wa"/><text x="382.7" y="52.3" class="n m">50°</text><path d="M344.9903432880895 70 L315.0 70.0 A30 30 0 0 0 330.9 96.5 Z" class="wa"/><text x="307.3" y="97.7" class="n m">50°</text><path d="M344.9903432880895 70 L330.9 96.5 A30 30 0 0 0 375.0 70.0 Z" class="wo"/><text x="367.7" y="112.7" class="n m">130°</text><path d="M294.477947280249 165 L308.6 138.5 A30 30 0 0 0 264.5 165.0 Z" class="wo"/><text x="271.8" y="132.3" class="n m">130°</text><path d="M294.477947280249 165 L324.5 165.0 A30 30 0 0 0 308.6 138.5 Z" class="wa"/><text x="332.2" y="147.3" class="n m">50°</text><path d="M294.477947280249 165 L264.5 165.0 A30 30 0 0 0 280.4 191.5 Z" class="wa"/><text x="256.8" y="192.7" class="n m">50°</text><path d="M294.477947280249 165 L280.4 191.5 A30 30 0 0 0 324.5 165.0 Z" class="wo"/><text x="317.1" y="207.7" class="n m">130°</text><text x="500" y="112" class="b">50° + 130° = 180°</text><text x="20" y="238" class="s">Find one angle, then every other is that angle or its supplement.</text>
</svg>
