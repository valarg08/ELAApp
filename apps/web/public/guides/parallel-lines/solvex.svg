<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-label="Solving for x: pick the relationship, write the equation, solve it, then use x to find the angle. Vertical angles are equal, a linear pair adds up to 180, and the parts of a right angle add up to 90.">
<title>Solving for x: pick the relationship, write the equation, solve it, then use x to find the angle. Vertical angles are equal, a linear pair adds up to 180, and the parts of a right angle add up to 90.</title>
<style>
text{font:15px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#334155}
.t{font-weight:700;font-size:17px}
.s{font-size:13px;fill:#64748b}
.big{font-size:22px;font-weight:700}
.n{font-size:14px;font-weight:700}
.m{text-anchor:middle}
.a{fill:#0f766e;font-weight:700}
.o{fill:#c2410c;font-weight:700}
.b{fill:#1d4ed8;font-weight:700}
.ln{stroke:#334155;stroke-width:2.5;fill:none;stroke-linecap:round}
.th{stroke:#2563eb;stroke-width:2.5;fill:none;stroke-linecap:round}
.ar{stroke:#334155;stroke-width:1.8;fill:none}
.wa{fill:#0d9488;fill-opacity:.35}
.wo{fill:#ea580c;fill-opacity:.32}
.wb{fill:#2563eb;fill-opacity:.25}
.box{fill:none;stroke:#64748b;stroke-width:1.5}
.sh{fill:#e2e8f0;fill-opacity:.0;stroke:#334155;stroke-width:2.5;stroke-linejoin:round}
@media (prefers-color-scheme:dark){
text{fill:#e2e8f0}.s{fill:#94a3b8}.a{fill:#5eead4}.o{fill:#fdba74}.b{fill:#93c5fd}
.ln,.ar,.sh{stroke:#e2e8f0}.box{stroke:#94a3b8}.th{stroke:#93c5fd}
}
</style>
<text x="20" y="28" class="t">Relationship → equation → solve → angle</text><rect x="20" y="50" width="600" height="44" rx="8" class="box"/><text x="34" y="78" class="s">vertical angles</text><text x="250" y="78" class="a">equal</text><text x="400" y="78">5x = 3x + 24</text><rect x="20" y="104" width="600" height="44" rx="8" class="box"/><text x="34" y="132" class="s">linear pair / straight line</text><text x="250" y="132" class="o">add to 180°</text><text x="400" y="132">30 + (2x + 5) = 180</text><rect x="20" y="158" width="600" height="44" rx="8" class="box"/><text x="34" y="186" class="s">right angle</text><text x="250" y="186" class="b">add to 90°</text><text x="400" y="186">7x + 11x = 90</text><text x="20" y="238" class="s">Find x first, then put it back into the expression for the angle you were asked for.</text>
</svg>
