<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img" aria-label="Exponent rules shown with tiles: 3² × 3³ = 3⁵, 5⁶ ÷ 5⁴ = 5², and (2²)³ = 2⁶">
<title>Exponent rules shown with tiles: 3² × 3³ = 3⁵, 5⁶ ÷ 5⁴ = 5², and (2²)³ = 2⁶</title>
<style>
.l{stroke:#334155;stroke-width:2;fill:none;stroke-linejoin:round}
.d{stroke:#334155;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.a{stroke:#0d9488;stroke-width:3;fill:none;stroke-linejoin:round}
.h{stroke:#ea580c;stroke-width:3.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.v{stroke:#7c3aed;stroke-width:3;fill:none;stroke-linejoin:round}
.b{stroke:#2563eb;stroke-width:3;fill:none;stroke-linejoin:round}
.g{stroke:#cbd5e1;stroke-width:1}
.ax{stroke:#64748b;stroke-width:1.5}
.fa{fill:#0d9488;fill-opacity:.14}
.fh{fill:#ea580c;fill-opacity:.16}
.fv{fill:#7c3aed;fill-opacity:.12}
.fb{fill:#2563eb;fill-opacity:.12}
.dot{fill:#334155}
text{font:15px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#334155}
.t{font-weight:700;font-size:15px}
.s{font-size:13px;fill:#64748b}
.ht{fill:#c2410c;font-weight:700}
.at{fill:#0f766e;font-weight:700}
.vt{fill:#6d28d9;font-weight:700}
.bt{fill:#1d4ed8;font-weight:700}
@media (prefers-color-scheme:dark){
.l,.d{stroke:#cbd5e1}.dot{fill:#cbd5e1}text{fill:#e2e8f0}.s{fill:#94a3b8}
.a{stroke:#2dd4bf}.h{stroke:#fb923c}.v{stroke:#a78bfa}.b{stroke:#60a5fa}
.g{stroke:#334155}.ax{stroke:#94a3b8}
.ht{fill:#fb923c}.at{fill:#2dd4bf}.vt{fill:#a78bfa}.bt{fill:#60a5fa}}
</style>
<text class="t" x="20" y="30" text-anchor="start">Product: add the exponents</text><rect class="l fa" x="20" y="44" width="28" height="28" rx="6"/><text x="34" y="63" text-anchor="middle">3</text><rect class="l fa" x="54" y="44" width="28" height="28" rx="6"/><text x="68" y="63" text-anchor="middle">3</text><text x="100" y="64" text-anchor="middle">×</text><rect class="l fh" x="116" y="44" width="28" height="28" rx="6"/><text x="130" y="63" text-anchor="middle">3</text><rect class="l fh" x="150" y="44" width="28" height="28" rx="6"/><text x="164" y="63" text-anchor="middle">3</text><rect class="l fh" x="184" y="44" width="28" height="28" rx="6"/><text x="198" y="63" text-anchor="middle">3</text><text x="240" y="64" text-anchor="start">= 3⁵   (2 + 3 = 5 threes)</text><text class="t" x="20" y="116" text-anchor="start">Quotient: subtract the exponents</text><rect class="l fa" x="20" y="130" width="28" height="28" rx="6"/><text x="34" y="149" text-anchor="middle">5</text><rect class="l fa" x="54" y="130" width="28" height="28" rx="6"/><text x="68" y="149" text-anchor="middle">5</text><rect class="l fa" x="88" y="130" width="28" height="28" rx="6"/><text x="102" y="149" text-anchor="middle">5</text><rect class="l fa" x="122" y="130" width="28" height="28" rx="6"/><text x="136" y="149" text-anchor="middle">5</text><rect class="l fa" x="156" y="130" width="28" height="28" rx="6"/><text x="170" y="149" text-anchor="middle">5</text><rect class="l fa" x="190" y="130" width="28" height="28" rx="6"/><text x="204" y="149" text-anchor="middle">5</text><text x="230" y="150" text-anchor="middle">÷</text><rect class="l fh" x="248" y="130" width="28" height="28" rx="6"/><text x="262" y="149" text-anchor="middle">5</text><rect class="l fh" x="282" y="130" width="28" height="28" rx="6"/><text x="296" y="149" text-anchor="middle">5</text><rect class="l fh" x="316" y="130" width="28" height="28" rx="6"/><text x="330" y="149" text-anchor="middle">5</text><rect class="l fh" x="350" y="130" width="28" height="28" rx="6"/><text x="364" y="149" text-anchor="middle">5</text><text x="390" y="150" text-anchor="start">= 5²   (4 cancel)</text><text class="t" x="20" y="202" text-anchor="start">Power of a power: multiply</text><rect class="d" x="16" y="212" width="76" height="40" rx="8"/><rect class="l fv" x="22" y="218" width="28" height="28" rx="6"/><text x="36" y="237" text-anchor="middle">2</text><rect class="l fv" x="56" y="218" width="28" height="28" rx="6"/><text x="70" y="237" text-anchor="middle">2</text><rect class="d" x="100" y="212" width="76" height="40" rx="8"/><rect class="l fv" x="106" y="218" width="28" height="28" rx="6"/><text x="120" y="237" text-anchor="middle">2</text><rect class="l fv" x="140" y="218" width="28" height="28" rx="6"/><text x="154" y="237" text-anchor="middle">2</text><rect class="d" x="184" y="212" width="76" height="40" rx="8"/><rect class="l fv" x="190" y="218" width="28" height="28" rx="6"/><text x="204" y="237" text-anchor="middle">2</text><rect class="l fv" x="224" y="218" width="28" height="28" rx="6"/><text x="238" y="237" text-anchor="middle">2</text><text x="272" y="238" text-anchor="start">= (2²)³ = 2⁶</text><text class="ht" x="20" y="286" text-anchor="start">Brackets decide the base: (−4)² = 16 but −4² = −16</text>
</svg>
