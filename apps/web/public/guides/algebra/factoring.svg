<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" role="img" aria-label="Factoring: a sum-product diamond for x² + x − 12 giving (x + 4)(x − 3), and an area model splitting 3x² + 10x + 8 into (3x + 4)(x + 2)">
<title>Factoring: a sum-product diamond for x² + x − 12 giving (x + 4)(x − 3), and an area model splitting 3x² + 10x + 8 into (3x + 4)(x + 2)</title>
<style>
.l{stroke:#334155;stroke-width:2;fill:none;stroke-linejoin:round}
.d{stroke:#334155;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.a{stroke:#0d9488;stroke-width:3;fill:none;stroke-linejoin:round}
.h{stroke:#ea580c;stroke-width:3.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.v{stroke:#7c3aed;stroke-width:3;fill:none;stroke-linejoin:round}
.b{stroke:#2563eb;stroke-width:3;fill:none;stroke-linejoin:round}
.g{stroke:#cbd5e1;stroke-width:1}
.ax{stroke:#64748b;stroke-width:1.5}
.fa{fill:#0d9488;fill-opacity:.14}
.fh{fill:#ea580c;fill-opacity:.16}
.fv{fill:#7c3aed;fill-opacity:.12}
.fb{fill:#2563eb;fill-opacity:.12}
.dot{fill:#334155}
text{font:15px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#334155}
.t{font-weight:700;font-size:15px}
.s{font-size:13px;fill:#64748b}
.ht{fill:#c2410c;font-weight:700}
.at{fill:#0f766e;font-weight:700}
.vt{fill:#6d28d9;font-weight:700}
.bt{fill:#1d4ed8;font-weight:700}
@media (prefers-color-scheme:dark){
.l,.d{stroke:#cbd5e1}.dot{fill:#cbd5e1}text{fill:#e2e8f0}.s{fill:#94a3b8}
.a{stroke:#2dd4bf}.h{stroke:#fb923c}.v{stroke:#a78bfa}.b{stroke:#60a5fa}
.g{stroke:#334155}.ax{stroke:#94a3b8}
.ht{fill:#fb923c}.at{fill:#2dd4bf}.vt{fill:#a78bfa}.bt{fill:#60a5fa}}
</style>
<text class="t" x="120" y="24" text-anchor="middle">x² + x − 12</text><polygon class="l fa" points="120,60 190,130 120,200 50,130"/><line class="l" x1="85" y1="95" x2="155" y2="165"/><line class="l" x1="155" y1="95" x2="85" y2="165"/><text class="ht" x="120" y="100" text-anchor="middle">−12</text><text class="at" x="120" y="172" text-anchor="middle">+1</text><text class="t" x="82" y="136" text-anchor="middle">4</text><text class="t" x="158" y="136" text-anchor="middle">−3</text><text class="s" x="120" y="228" text-anchor="middle">product −12 (top), sum 1 (bottom)</text><text class="at" x="120" y="248" text-anchor="middle">→ (x + 4)(x − 3)</text><text class="t" x="470" y="24" text-anchor="middle">3x² + 10x + 8</text><rect class="l fa" x="380" y="60" width="110" height="70" rx="6"/><rect class="l fh" x="490" y="60" width="70" height="70" rx="6"/><rect class="l fh" x="380" y="130" width="110" height="50" rx="6"/><rect class="l fv" x="490" y="130" width="70" height="50" rx="6"/><text class="at" x="435" y="100" text-anchor="middle">3x²</text><text class="ht" x="525" y="100" text-anchor="middle">6x</text><text class="ht" x="435" y="160" text-anchor="middle">4x</text><text class="vt" x="525" y="160" text-anchor="middle">8</text><text class="s" x="435" y="52" text-anchor="middle">x</text><text class="s" x="525" y="52" text-anchor="middle">+2</text><text class="s" x="372" y="100" text-anchor="end">3x</text><text class="s" x="372" y="160" text-anchor="end">+4</text><text class="s" x="470" y="210" text-anchor="middle">ac = 24 → 6 and 4 (sum 10)</text><text class="at" x="470" y="232" text-anchor="middle">= (3x + 4)(x + 2)</text>
</svg>
