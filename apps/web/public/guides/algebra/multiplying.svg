.l,.d{stroke:#cbd5e1}.dot{fill:#cbd5e1}text{fill:#e2e8f0}.s{fill:#94a3b8}
.a{stroke:#2dd4bf}.h{stroke:#fb923c}.v{stroke:#a78bfa}.b{stroke:#60a5fa}
.g{stroke:#334155}.ax{stroke:#94a3b8}
.ht{fill:#fb923c}.at{fill:#2dd4bf}.vt{fill:#a78bfa}.bt{fill:#60a5fa}}
</style>
<text class="t" x="180" y="24" text-anchor="middle">(x + 2)(x + 6)</text><rect class="l fa" x="70" y="50" width="120" height="120" rx="6"/><rect class="l fh" x="190" y="50" width="150" height="120" rx="6"/><rect class="l fh" x="70" y="170" width="120" height="50.4" rx="6"/><rect class="l fv" x="190" y="170" width="150" height="50.4" rx="6"/><text class="s" x="130" y="40" text-anchor="middle">x</text><text class="s" x="265" y="40" text-anchor="middle">+6</text><text class="s" x="60" y="110" text-anchor="end">x</text><text class="s" x="60" y="200" text-anchor="end">+2</text><text class="at" x="130" y="115" text-anchor="middle">x²</text><text class="ht" x="265" y="115" text-anchor="middle">6x</text><text class="ht" x="130" y="200" text-anchor="middle">2x</text><text class="vt" x="265" y="200" text-anchor="middle">12</text><text x="400" y="100" text-anchor="start">x² + 6x + 2x + 12</text><text class="t" x="400" y="130" text-anchor="start">= x² + 8x + 12</text><text class="s" x="400" y="170" text-anchor="start">FOIL: First, Outside,</text><text class="s" x="400" y="190" text-anchor="start">Inside, Last</text>
