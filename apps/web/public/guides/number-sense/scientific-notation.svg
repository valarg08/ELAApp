<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" width="600" height="310" role="img" aria-label="3.2 × 10⁵ = 320,000 with the decimal point hopping 5 places right, and 0.00061 = 6.1 × 10⁻⁴ with the point hopping 4 places">
<title>3.2 × 10⁵ = 320,000 with the decimal point hopping 5 places right, and 0.00061 = 6.1 × 10⁻⁴ with the point hopping 4 places</title>
<style>
.l{stroke:#334155;stroke-width:2;fill:none;stroke-linejoin:round}
.d{stroke:#334155;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.a{stroke:#0d9488;stroke-width:3;fill:none;stroke-linejoin:round}
.h{stroke:#ea580c;stroke-width:3.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
