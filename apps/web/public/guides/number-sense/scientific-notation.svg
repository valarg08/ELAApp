</style>
<text class="t" x="20" y="26" text-anchor="start">a × 10ⁿ with 1 ≤ a &lt; 10</text><text class="t" x="71" y="118" text-anchor="middle">3</text><text class="t" x="93" y="118" text-anchor="middle">2</text><text class="s" x="115" y="118" text-anchor="middle">0</text><text class="s" x="137" y="118" text-anchor="middle">0</text><text class="s" x="159" y="118" text-anchor="middle">0</text><text class="s" x="181" y="118" text-anchor="middle">0</text><circle class="dot" cx="82" cy="120" r="3"/><path class="h" d="M82,96 Q93,74 104,96"/><path class="h" d="M104,96 Q115,74 126,96"/><path class="h" d="M126,96 Q137,74 148,96"/><path class="h" d="M148,96 Q159,74 170,96"/><path class="h" d="M170,96 Q181,74 192,96"/><circle class="ht" cx="192" cy="120" r="4"/><text x="212" y="118" text-anchor="start">3.2 × 10⁵ = 320,000</text><text class="s" x="212" y="140" text-anchor="start">n = 5 > 0 → point moves 5 right</text><text class="s" x="71" y="218" text-anchor="middle">0</text><text class="s" x="93" y="218" text-anchor="middle">0</text><text class="s" x="115" y="218" text-anchor="middle">0</text><text class="s" x="137" y="218" text-anchor="middle">0</text><text class="t" x="159" y="218" text-anchor="middle">6</text><text class="t" x="181" y="218" text-anchor="middle">1</text><circle class="dot" cx="82" cy="220" r="3"/><path class="a" d="M82,196 Q93,174 104,196"/><path class="a" d="M104,196 Q115,174 126,196"/><path class="a" d="M126,196 Q137,174 148,196"/><path class="a" d="M148,196 Q159,174 170,196"/><circle class="at" cx="170" cy="220" r="4"/><text x="212" y="218" text-anchor="start">0.00061 = 6.1 × 10⁻⁴</text><text class="s" x="212" y="240" text-anchor="start">point moved 4 right → n = −4</text><text class="s" x="20" y="290" text-anchor="start">Big numbers → positive n; numbers between 0 and 1 → negative n</text>
