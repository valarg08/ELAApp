<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="Fraction bars: 1/3 + 1/2 rewritten as 2/6 + 3/6 = 5/6, and 3/4 ÷ 2/5 = 3/4 × 5/2 = 15/8 by keep-change-flip">
<title>Fraction bars: 1/3 + 1/2 rewritten as 2/6 + 3/6 = 5/6, and 3/4 ÷ 2/5 = 3/4 × 5/2 = 15/8 by keep-change-flip</title>
<style>
.l{stroke:#334155;stroke-width:2;fill:none;stroke-linejoin:round}
.d{stroke:#334155;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.a{stroke:#0d9488;stroke-width:3;fill:none;stroke-linejoin:round}
.h{stroke:#ea580c;stroke-width:3.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.v{stroke:#7c3aed;stroke-width:3;fill:none;stroke-linejoin:round}
.b{stroke:#2563eb;stroke-width:3;fill:none;stroke-linejoin:round}
.g{stroke:#cbd5e1;stroke-width:1}
.ax{stroke:#64748b;stroke-width:1.5}
.fa{fill:#0d9488;fill-opacity:.14}
.fh{fill:#ea580c;fill-opacity:.16}
.fv{fill:#7c3aed;fill-opacity:.12}
.fb{fill:#2563eb;fill-opacity:.12}
.dot{fill:#334155}
text{font:15px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#334155}
.t{font-weight:700;font-size:15px}
.s{font-size:13px;fill:#64748b}
.ht{fill:#c2410c;font-weight:700}
.at{fill:#0f766e;font-weight:700}
.vt{fill:#6d28d9;font-weight:700}
.bt{fill:#1d4ed8;font-weight:700}
@media (prefers-color-scheme:dark){
.l,.d{stroke:#cbd5e1}.dot{fill:#cbd5e1}text{fill:#e2e8f0}.s{fill:#94a3b8}
.a{stroke:#2dd4bf}.h{stroke:#fb923c}.v{stroke:#a78bfa}.b{stroke:#60a5fa}
.g{stroke:#334155}.ax{stroke:#94a3b8}
.ht{fill:#fb923c}.at{fill:#2dd4bf}.vt{fill:#a78bfa}.bt{fill:#60a5fa}}
</style>
<text class="t" x="20" y="26" text-anchor="start">Add: make the pieces the same size</text><rect class="l fh" x="80" y="50" width="80" height="30"/><rect class="l" x="160" y="50" width="80" height="30"/><rect class="l" x="240" y="50" width="80" height="30"/><text x="70" y="71" text-anchor="end">1/3</text><rect class="l fa" x="80" y="90" width="120" height="30"/><rect class="l" x="200" y="90" width="120" height="30"/><text x="70" y="111" text-anchor="end">1/2</text><text class="s" x="200" y="146" text-anchor="middle">↓ cut into sixths</text><rect class="l fh" x="80" y="160" width="40" height="30"/><rect class="l fh" x="120" y="160" width="40" height="30"/><rect class="l" x="160" y="160" width="40" height="30"/><rect class="l" x="200" y="160" width="40" height="30"/><rect class="l" x="240" y="160" width="40" height="30"/><rect class="l" x="280" y="160" width="40" height="30"/><text x="70" y="181" text-anchor="end">2/6</text><rect class="l fa" x="80" y="200" width="40" height="30"/><rect class="l fa" x="120" y="200" width="40" height="30"/><rect class="l fa" x="160" y="200" width="40" height="30"/><rect class="l" x="200" y="200" width="40" height="30"/><rect class="l" x="240" y="200" width="40" height="30"/><rect class="l" x="280" y="200" width="40" height="30"/><text x="70" y="221" text-anchor="end">3/6</text><rect class="l fh" x="80" y="250" width="40" height="30"/><rect class="l fh" x="120" y="250" width="40" height="30"/><rect class="l fa" x="160" y="250" width="40" height="30"/><rect class="l fa" x="200" y="250" width="40" height="30"/><rect class="l fa" x="240" y="250" width="40" height="30"/><rect class="l" x="280" y="250" width="40" height="30"/><text class="at" x="70" y="271" text-anchor="end">5/6</text><text class="t" x="200" y="306" text-anchor="middle">1/3 + 1/2 = 2/6 + 3/6 = 5/6</text><text class="t" x="420" y="26" text-anchor="start">Divide: keep, change, flip</text><text class="t" x="430" y="90" text-anchor="start">3/4</text><text x="480" y="90" text-anchor="start">÷</text><text class="ht" x="506" y="90" text-anchor="start">2/5</text><text class="t" x="430" y="150" text-anchor="start">3/4</text><text class="at" x="480" y="150" text-anchor="start">×</text><text class="ht" x="506" y="150" text-anchor="start">5/2</text><text class="s" x="430" y="118" text-anchor="start">keep</text><text class="s" x="476" y="118" text-anchor="start">change</text><text class="s" x="524" y="118" text-anchor="start">flip</text><text class="at" x="430" y="200" text-anchor="start">= 15/8</text><text class="s" x="430" y="250" text-anchor="start">Multiply: tops × tops,</text><text class="s" x="430" y="270" text-anchor="start">bottoms × bottoms</text>
</svg>
