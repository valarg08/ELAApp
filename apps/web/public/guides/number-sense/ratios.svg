<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" width="700" height="290" role="img" aria-label="A double number line matching 3 cups of flour to 2 eggs, 6 to 4 and 9 to 6: 3/2 = x/6 gives x = 9">
<title>A double number line matching 3 cups of flour to 2 eggs, 6 to 4 and 9 to 6: 3/2 = x/6 gives x = 9</title>
<style>
.l{stroke:#334155;stroke-width:2;fill:none;stroke-linejoin:round}
.d{stroke:#334155;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.a{stroke:#0d9488;stroke-width:3;fill:none;stroke-linejoin:round}
.h{stroke:#ea580c;stroke-width:3.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.v{stroke:#7c3aed;stroke-width:3;fill:none;stroke-linejoin:round}
.b{stroke:#2563eb;stroke-width:3;fill:none;stroke-linejoin:round}
.g{stroke:#cbd5e1;stroke-width:1}
.ax{stroke:#64748b;stroke-width:1.5}
.fa{fill:#0d9488;fill-opacity:.14}
.fh{fill:#ea580c;fill-opacity:.16}
.fv{fill:#7c3aed;fill-opacity:.12}
.fb{fill:#2563eb;fill-opacity:.12}
.dot{fill:#334155}
text{font:15px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#334155}
.t{font-weight:700;font-size:15px}
.s{font-size:13px;fill:#64748b}
.ht{fill:#c2410c;font-weight:700}
.at{fill:#0f766e;font-weight:700}
.vt{fill:#6d28d9;font-weight:700}
.bt{fill:#1d4ed8;font-weight:700}
@media (prefers-color-scheme:dark){
.l,.d{stroke:#cbd5e1}.dot{fill:#cbd5e1}text{fill:#e2e8f0}.s{fill:#94a3b8}
.a{stroke:#2dd4bf}.h{stroke:#fb923c}.v{stroke:#a78bfa}.b{stroke:#60a5fa}
.g{stroke:#334155}.ax{stroke:#94a3b8}
.ht{fill:#fb923c}.at{fill:#2dd4bf}.vt{fill:#a78bfa}.bt{fill:#60a5fa}}
</style>
<text class="t" x="20" y="26" text-anchor="start">Equal ratios: flour : eggs = 3 : 2</text><line class="l" x1="120" y1="80" x2="620" y2="80"/><line class="l" x1="120" y1="160" x2="620" y2="160"/><text class="s" x="110" y="85" text-anchor="end">cups of flour</text><text class="s" x="110" y="165" text-anchor="end">eggs</text><line class="l" x1="140" y1="73" x2="140" y2="87"/><line class="l" x1="140" y1="153" x2="140" y2="167"/><text x="140" y="66" text-anchor="middle">0</text><text x="140" y="186" text-anchor="middle">0</text><line class="l" x1="290" y1="73" x2="290" y2="87"/><line class="l" x1="290" y1="153" x2="290" y2="167"/><text class="at" x="290" y="66" text-anchor="middle">3</text><text class="at" x="290" y="186" text-anchor="middle">2</text><line class="l" x1="440" y1="73" x2="440" y2="87"/><line class="l" x1="440" y1="153" x2="440" y2="167"/><text x="440" y="66" text-anchor="middle">6</text><text x="440" y="186" text-anchor="middle">4</text><line class="l" x1="590" y1="73" x2="590" y2="87"/><line class="l" x1="590" y1="153" x2="590" y2="167"/><text class="ht" x="590" y="66" text-anchor="middle">x = 9</text><text class="ht" x="590" y="186" text-anchor="middle">6</text><path class="d" d="M290,198 Q440,238 590,198"/><text class="ht" x="440" y="234" text-anchor="middle">× 3</text><text x="20" y="270" text-anchor="start">3/2 = x/6  →  scale factor 3, so x = 9   (or cross-multiply: 2x = 18)</text>
</svg>
