<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-label="A number line from −6 to 6 with −2 − (−5) = 3 as a jump right and 3 + (−7) = −4 as a jump left, and a sign table for products">
<title>A number line from −6 to 6 with −2 − (−5) = 3 as a jump right and 3 + (−7) = −4 as a jump left, and a sign table for products</title>
<style>
