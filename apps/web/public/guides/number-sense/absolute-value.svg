<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" width="700" height="230" role="img" aria-label="A number line with −4 and 4 each 4 units from 0, so |−4| = |4| = 4">
<title>A number line with −4 and 4 each 4 units from 0, so |−4| = |4| = 4</title>
<style>
