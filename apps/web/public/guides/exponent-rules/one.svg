<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-label="The one exponent: any number to the first power is itself, so 5 to the 1 is 5. A letter with no written exponent has exponent 1, so y cubed times y is y cubed times y to the 1, which is y to the 4.">
<title>The one exponent: any number to the first power is itself, so 5 to the 1 is 5. A letter with no written exponent has exponent 1, so y cubed times y is y cubed times y to the 1, which is y to the 4.</title>
<style>
text{font:16px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#334155}
.t{font-weight:700;font-size:18px}
.s{font-size:14px;fill:#64748b}
.big{font-size:26px;font-weight:700}
.m{text-anchor:middle}
.e{text-anchor:end}
.a{fill:#0f766e;font-weight:700}
.o{fill:#c2410c;font-weight:700}
.b{fill:#1d4ed8;font-weight:700}
.chip{fill:#0d9488;fill-opacity:.2;stroke:#0d9488;stroke-width:2}
.chip2{fill:#ea580c;fill-opacity:.18;stroke:#ea580c;stroke-width:2}
.chip3{fill:#2563eb;fill-opacity:.16;stroke:#2563eb;stroke-width:2}
.gone{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:4 3}
.box{fill:none;stroke:#64748b;stroke-width:1.5;rx:8}
.ln{stroke:#334155;stroke-width:2}
.ar{stroke:#64748b;stroke-width:2;fill:none}
@media (prefers-color-scheme:dark){
text{fill:#e2e8f0}.s{fill:#94a3b8}.a{fill:#5eead4}.o{fill:#fdba74}.b{fill:#93c5fd}
.ln{stroke:#e2e8f0}.box,.ar{stroke:#94a3b8}.gone{stroke:#64748b}
}
</style>
<text x="20" y="34" class="t">The invisible exponent 1</text><text x="20" y="90" class="big">a¹ = a</text><text x="20" y="130">9¹ = 9      x¹ = x</text><text x="20" y="170" class="s">No exponent written means the exponent is 1:</text><text x="20" y="200" class="b">y³ · y = y³ · y¹ = y⁴</text><rect x="380" y="60" width="240" height="120" class="box"/><text x="395" y="88" class="s">Add the 1 when you simplify:</text><text x="395" y="118" class="o">x · x · x</text><text x="395" y="148" class="o">= x¹ · x¹ · x¹ = x³</text>
</svg>
