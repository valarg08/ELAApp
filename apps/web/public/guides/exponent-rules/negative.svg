<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-label="The negative exponent: continuing the pattern past 3 to the 0, each step divides by 3 again, so 3 to the negative 1 is one third and 3 to the negative 2 is one ninth. A negative exponent means take the reciprocal.">
<title>The negative exponent: continuing the pattern past 3 to the 0, each step divides by 3 again, so 3 to the negative 1 is one third and 3 to the negative 2 is one ninth. A negative exponent means take the reciprocal.</title>
<style>
text{font:16px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#334155}
.t{font-weight:700;font-size:18px}
.s{font-size:14px;fill:#64748b}
.big{font-size:26px;font-weight:700}
.m{text-anchor:middle}
.e{text-anchor:end}
.a{fill:#0f766e;font-weight:700}
.o{fill:#c2410c;font-weight:700}
.b{fill:#1d4ed8;font-weight:700}
.chip{fill:#0d9488;fill-opacity:.2;stroke:#0d9488;stroke-width:2}
.chip2{fill:#ea580c;fill-opacity:.18;stroke:#ea580c;stroke-width:2}
.chip3{fill:#2563eb;fill-opacity:.16;stroke:#2563eb;stroke-width:2}
.gone{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:4 3}
.box{fill:none;stroke:#64748b;stroke-width:1.5;rx:8}
.ln{stroke:#334155;stroke-width:2}
.ar{stroke:#64748b;stroke-width:2;fill:none}
@media (prefers-color-scheme:dark){
text{fill:#e2e8f0}.s{fill:#94a3b8}.a{fill:#5eead4}.o{fill:#fdba74}.b{fill:#93c5fd}
.ln{stroke:#e2e8f0}.box,.ar{stroke:#94a3b8}.gone{stroke:#64748b}
}
</style>
<text x="20" y="34" class="t">A negative exponent means reciprocal</text><text x="60" y="96" class="big m ">3²</text><text x="60" y="126" class="m">= 9</text><text x="178" y="96" class="big m ">3¹</text><text x="178" y="126" class="m">= 3</text><text x="296" y="96" class="big m ">3⁰</text><text x="296" y="126" class="m">= 1</text><text x="414" y="96" class="big m o">3⁻¹</text><text x="414" y="126" class="m">= 1/3</text><text x="532" y="96" class="big m o">3⁻²</text><text x="532" y="126" class="m">= 1/9</text><path d="M84 78 H100" class="ar"/><path d="M202 78 H218" class="ar"/><path d="M320 78 H336" class="ar"/><path d="M438 78 H454" class="ar"/><text x="20" y="168">The pattern keeps dividing by 3, so 3⁻² = 1/3² = 1/9.</text><text x="20" y="204" class="a">a⁻ⁿ = 1/aⁿ      1/a⁻ⁿ = aⁿ      (a/b)⁻ⁿ = (b/a)ⁿ</text>
</svg>
