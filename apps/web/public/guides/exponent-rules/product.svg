<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-label="Product of powers: three threes times four threes is seven threes, so 3 to the 3 times 3 to the 4 equals 3 to the 7. Same base: keep it and add the exponents.">
<title>Product of powers: three threes times four threes is seven threes, so 3 to the 3 times 3 to the 4 equals 3 to the 7. Same base: keep it and add the exponents.</title>
<style>
text{font:16px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#334155}
.t{font-weight:700;font-size:18px}
.s{font-size:14px;fill:#64748b}
.big{font-size:26px;font-weight:700}
.m{text-anchor:middle}
.e{text-anchor:end}
.a{fill:#0f766e;font-weight:700}
.o{fill:#c2410c;font-weight:700}
.b{fill:#1d4ed8;font-weight:700}
.chip{fill:#0d9488;fill-opacity:.2;stroke:#0d9488;stroke-width:2}
.chip2{fill:#ea580c;fill-opacity:.18;stroke:#ea580c;stroke-width:2}
.chip3{fill:#2563eb;fill-opacity:.16;stroke:#2563eb;stroke-width:2}
.gone{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:4 3}
.box{fill:none;stroke:#64748b;stroke-width:1.5;rx:8}
.ln{stroke:#334155;stroke-width:2}
.ar{stroke:#64748b;stroke-width:2;fill:none}
@media (prefers-color-scheme:dark){
text{fill:#e2e8f0}.s{fill:#94a3b8}.a{fill:#5eead4}.o{fill:#fdba74}.b{fill:#93c5fd}
.ln{stroke:#e2e8f0}.box,.ar{stroke:#94a3b8}.gone{stroke:#64748b}
}
</style>
<text x="20" y="34" class="t">Same base: add the exponents</text><text x="20" y="80" class="big">3³ · 3⁴</text><circle cx="40" cy="130" r="11" class="chip"/><text x="40" y="135" class="m" style="font-size:13px">3</text><circle cx="68" cy="130" r="11" class="chip"/><text x="68" y="135" class="m" style="font-size:13px">3</text><circle cx="96" cy="130" r="11" class="chip"/><text x="96" y="135" class="m" style="font-size:13px">3</text><text x="135" y="135" class="m">·</text><circle cx="165" cy="130" r="11" class="chip2"/><text x="165" y="135" class="m" style="font-size:13px">3</text><circle cx="193" cy="130" r="11" class="chip2"/><text x="193" y="135" class="m" style="font-size:13px">3</text><circle cx="221" cy="130" r="11" class="chip2"/><text x="221" y="135" class="m" style="font-size:13px">3</text><circle cx="249" cy="130" r="11" class="chip2"/><text x="249" y="135" class="m" style="font-size:13px">3</text><path d="M30 152 H112" class="ar"/><path d="M153 152 H258" class="ar"/><text x="40" y="178" class="s">3 factors</text><text x="160" y="178" class="s">4 factors</text><text x="300" y="135" class="b">=  seven factors of 3  =  3⁷</text><text x="20" y="224" class="a">aᵐ · aⁿ = aᵐ⁺ⁿ    (3 + 4 = 7 factors in all)</text>
</svg>
