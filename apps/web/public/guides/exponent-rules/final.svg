<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-label="The exponent rules on one page: product, quotient, power of a power, power of a product, power of a quotient, one, zero and negative exponent rules.">
<title>The exponent rules on one page: product, quotient, power of a power, power of a product, power of a quotient, one, zero and negative exponent rules.</title>
<style>
text{font:16px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#334155}
.t{font-weight:700;font-size:18px}
.s{font-size:14px;fill:#64748b}
.big{font-size:26px;font-weight:700}
.m{text-anchor:middle}
.e{text-anchor:end}
.a{fill:#0f766e;font-weight:700}
.o{fill:#c2410c;font-weight:700}
.b{fill:#1d4ed8;font-weight:700}
.chip{fill:#0d9488;fill-opacity:.2;stroke:#0d9488;stroke-width:2}
.chip2{fill:#ea580c;fill-opacity:.18;stroke:#ea580c;stroke-width:2}
.chip3{fill:#2563eb;fill-opacity:.16;stroke:#2563eb;stroke-width:2}
.gone{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:4 3}
.box{fill:none;stroke:#64748b;stroke-width:1.5;rx:8}
.ln{stroke:#334155;stroke-width:2}
.ar{stroke:#64748b;stroke-width:2;fill:none}
@media (prefers-color-scheme:dark){
text{fill:#e2e8f0}.s{fill:#94a3b8}.a{fill:#5eead4}.o{fill:#fdba74}.b{fill:#93c5fd}
.ln{stroke:#e2e8f0}.box,.ar{stroke:#94a3b8}.gone{stroke:#64748b}
}
</style>
<text x="20" y="30" class="t">All the rules, one page</text><rect x="20" y="40" width="290" height="38" class="box"/><text x="34" y="65" class="a">aᵐ · aⁿ = aᵐ⁺ⁿ</text><text x="296" y="65" class="s e">add</text><rect x="330" y="40" width="290" height="38" class="box"/><text x="344" y="65" class="a">aᵐ ÷ aⁿ = aᵐ⁻ⁿ</text><text x="606" y="65" class="s e">subtract</text><rect x="20" y="86" width="290" height="38" class="box"/><text x="34" y="111" class="o">(aᵐ)ⁿ = aᵐⁿ</text><text x="296" y="111" class="s e">multiply</text><rect x="330" y="86" width="290" height="38" class="box"/><text x="344" y="111" class="o">(ab)ⁿ = aⁿbⁿ</text><text x="606" y="111" class="s e">spread</text><rect x="20" y="132" width="290" height="38" class="box"/><text x="34" y="157" class="b">(a/b)ⁿ = aⁿ/bⁿ</text><text x="296" y="157" class="s e">spread</text><rect x="330" y="132" width="290" height="38" class="box"/><text x="344" y="157" class="b">a¹ = a</text><text x="606" y="157" class="s e">one</text><rect x="20" y="178" width="290" height="38" class="box"/><text x="34" y="203" class="a">a⁰ = 1</text><text x="296" y="203" class="s e">zero</text><rect x="330" y="178" width="290" height="38" class="box"/><text x="344" y="203" class="a">a⁻ⁿ = 1/aⁿ</text><text x="606" y="203" class="s e">flip</text>
</svg>
