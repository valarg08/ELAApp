<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-label="An exponent counts equal factors: the base 3 with the exponent 4 means four threes multiplied, 3 times 3 times 3 times 3, which is 81.">
<title>An exponent counts equal factors: the base 3 with the exponent 4 means four threes multiplied, 3 times 3 times 3 times 3, which is 81.</title>
<style>
text{font:16px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#334155}
.t{font-weight:700;font-size:18px}
.s{font-size:14px;fill:#64748b}
.big{font-size:26px;font-weight:700}
.m{text-anchor:middle}
.e{text-anchor:end}
.a{fill:#0f766e;font-weight:700}
.o{fill:#c2410c;font-weight:700}
.b{fill:#1d4ed8;font-weight:700}
.chip{fill:#0d9488;fill-opacity:.2;stroke:#0d9488;stroke-width:2}
.chip2{fill:#ea580c;fill-opacity:.18;stroke:#ea580c;stroke-width:2}
.chip3{fill:#2563eb;fill-opacity:.16;stroke:#2563eb;stroke-width:2}
.gone{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:4 3}
.box{fill:none;stroke:#64748b;stroke-width:1.5;rx:8}
.ln{stroke:#334155;stroke-width:2}
.ar{stroke:#64748b;stroke-width:2;fill:none}
@media (prefers-color-scheme:dark){
text{fill:#e2e8f0}.s{fill:#94a3b8}.a{fill:#5eead4}.o{fill:#fdba74}.b{fill:#93c5fd}
.ln{stroke:#e2e8f0}.box,.ar{stroke:#94a3b8}.gone{stroke:#64748b}
}
</style>
<text x="20" y="34" class="t">Base and exponent</text><text x="150" y="100" class="big">aᵐ</text><text x="150" y="130" class="s">base a: what is multiplied</text><text x="150" y="150" class="s">exponent m: how many factors</text><line x1="132" y1="84" x2="100" y2="64" class="ar"/><text x="20" y="190">3⁴ means four factors of 3:</text><circle cx="240" cy="186" r="11" class="chip"/><text x="240" y="191" class="m" style="font-size:13px">3</text><circle cx="268" cy="186" r="11" class="chip"/><text x="268" y="191" class="m" style="font-size:13px">3</text><circle cx="296" cy="186" r="11" class="chip"/><text x="296" y="191" class="m" style="font-size:13px">3</text><circle cx="324" cy="186" r="11" class="chip"/><text x="324" y="191" class="m" style="font-size:13px">3</text><text x="370" y="191" class="a">= 3 · 3 · 3 · 3 = 81</text>
</svg>
