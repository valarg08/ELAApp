<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-label="Quotient of powers: five threes on top and two threes on the bottom. Two pairs cancel and three threes are left, so 3 to the 5 over 3 squared is 3 cubed. Same base: keep it and subtract the exponents.">
<title>Quotient of powers: five threes on top and two threes on the bottom. Two pairs cancel and three threes are left, so 3 to the 5 over 3 squared is 3 cubed. Same base: keep it and subtract the exponents.</title>
<style>
text{font:16px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#334155}
.t{font-weight:700;font-size:18px}
.s{font-size:14px;fill:#64748b}
.big{font-size:26px;font-weight:700}
.m{text-anchor:middle}
.e{text-anchor:end}
.a{fill:#0f766e;font-weight:700}
.o{fill:#c2410c;font-weight:700}
.b{fill:#1d4ed8;font-weight:700}
.chip{fill:#0d9488;fill-opacity:.2;stroke:#0d9488;stroke-width:2}
.chip2{fill:#ea580c;fill-opacity:.18;stroke:#ea580c;stroke-width:2}
.chip3{fill:#2563eb;fill-opacity:.16;stroke:#2563eb;stroke-width:2}
.gone{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:4 3}
.box{fill:none;stroke:#64748b;stroke-width:1.5;rx:8}
.ln{stroke:#334155;stroke-width:2}
.ar{stroke:#64748b;stroke-width:2;fill:none}
@media (prefers-color-scheme:dark){
text{fill:#e2e8f0}.s{fill:#94a3b8}.a{fill:#5eead4}.o{fill:#fdba74}.b{fill:#93c5fd}
.ln{stroke:#e2e8f0}.box,.ar{stroke:#94a3b8}.gone{stroke:#64748b}
}
</style>
<text x="20" y="34" class="t">Same base: subtract the exponents</text><text x="20" y="80" class="big">3⁵ ÷ 3²</text><circle cx="40" cy="120" r="11" class="gone"/><text x="40" y="125" class="m" style="font-size:13px">3</text><circle cx="68" cy="120" r="11" class="gone"/><text x="68" y="125" class="m" style="font-size:13px">3</text><circle cx="96" cy="120" r="11" class="chip"/><text x="96" y="125" class="m" style="font-size:13px">3</text><circle cx="124" cy="120" r="11" class="chip"/><text x="124" y="125" class="m" style="font-size:13px">3</text><circle cx="152" cy="120" r="11" class="chip"/><text x="152" y="125" class="m" style="font-size:13px">3</text><line x1="30" y1="140" x2="190" y2="140" class="ln"/><circle cx="40" cy="164" r="11" class="gone"/><text x="40" y="169" class="m" style="font-size:13px">3</text><circle cx="68" cy="164" r="11" class="gone"/><text x="68" y="169" class="m" style="font-size:13px">3</text><text x="205" y="128" class="s">2 pairs cancel</text><text x="205" y="148" class="s">3 factors are left</text><text x="380" y="135" class="b">=  3 · 3 · 3  =  3³</text><text x="20" y="224" class="a">aᵐ ÷ aⁿ = aᵐ⁻ⁿ    (5 − 2 = 3)</text>
</svg>
