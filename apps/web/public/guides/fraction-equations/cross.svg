<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-label="Cross multiplication. For x over 4 equal to 5 over 6, multiply across the equals sign: 6 times x equals 4 times 5, so 6x equals 20 and x equals 20 over 6, which is 10 over 3.">
<title>Cross multiplication. For x over 4 equal to 5 over 6, multiply across the equals sign: 6 times x equals 4 times 5, so 6x equals 20 and x equals 20 over 6, which is 10 over 3.</title>
<style>
.l{stroke:#334155;stroke-width:2;fill:none;stroke-linejoin:round}
.d{stroke:#64748b;stroke-width:1.5;fill:none;stroke-dasharray:6 5}
.a{stroke:#0d9488;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.h{stroke:#ea580c;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.b{stroke:#2563eb;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fa{fill:#0d9488;fill-opacity:.15}
.fh{fill:#ea580c;fill-opacity:.14}
.fb{fill:#2563eb;fill-opacity:.12}
text{font:17px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#334155}
.t{font-weight:700;font-size:16px}
.s{font-size:14px;fill:#64748b}
.m{font-size:22px}
.big{font-size:30px;font-weight:600}
.at{fill:#0f766e;font-weight:700}
.ht{fill:#c2410c;font-weight:700}
.bt{fill:#1d4ed8;font-weight:700}
@media (prefers-color-scheme:dark){
.l{stroke:#cbd5e1}.d{stroke:#94a3b8}text{fill:#e2e8f0}.s{fill:#94a3b8}
.a{stroke:#2dd4bf}.h{stroke:#fb923c}.b{stroke:#60a5fa}
.at{fill:#2dd4bf}.ht{fill:#fb923c}.bt{fill:#60a5fa}}
</style>
<text class="t" x="20" y="28">One fraction = one fraction: cross multiply</text>
<text class="big bt" x="200" y="76" text-anchor="middle">x</text><line class="l" x1="180" y1="88" x2="220" y2="88"/><text class="big ht" x="200" y="120" text-anchor="middle">4</text>
<text class="big" x="320" y="102" text-anchor="middle">=</text>
<text class="big ht" x="440" y="76" text-anchor="middle">5</text><line class="l" x1="420" y1="88" x2="460" y2="88"/><text class="big bt" x="440" y="120" text-anchor="middle">6</text>
<text class="m" x="320" y="146" text-anchor="middle"><tspan class="bt">6 × x</tspan> = <tspan class="ht">4 × 5</tspan></text>
<text class="m" x="320" y="180" text-anchor="middle">6x = 20</text>
<text class="big at" x="320" y="224" text-anchor="middle">x = 20/6 = 10/3</text>
<text class="s" x="320" y="246" text-anchor="middle">Each top times the bottom of the other fraction.</text>
</svg>
