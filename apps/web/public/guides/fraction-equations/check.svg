<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-label="Checking a solution. For x over 4 plus 3 equals 5, the solution is x equals 8. Put 8 in both sides. The left side is 8 over 4 plus 3, which is 5, and the right side is 5. Both sides match, so 8 is correct.">
<title>Checking a solution. For x over 4 plus 3 equals 5, the solution is x equals 8. Put 8 in both sides. The left side is 8 over 4 plus 3, which is 5, and the right side is 5. Both sides match, so 8 is correct.</title>
<style>
.l{stroke:#334155;stroke-width:2;fill:none;stroke-linejoin:round}
.d{stroke:#64748b;stroke-width:1.5;fill:none;stroke-dasharray:6 5}
.a{stroke:#0d9488;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.h{stroke:#ea580c;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.b{stroke:#2563eb;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fa{fill:#0d9488;fill-opacity:.15}
.fh{fill:#ea580c;fill-opacity:.14}
.fb{fill:#2563eb;fill-opacity:.12}
text{font:17px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#334155}
.t{font-weight:700;font-size:16px}
.s{font-size:14px;fill:#64748b}
.m{font-size:22px}
.big{font-size:30px;font-weight:600}
.at{fill:#0f766e;font-weight:700}
.ht{fill:#c2410c;font-weight:700}
.bt{fill:#1d4ed8;font-weight:700}
@media (prefers-color-scheme:dark){
.l{stroke:#cbd5e1}.d{stroke:#94a3b8}text{fill:#e2e8f0}.s{fill:#94a3b8}
.a{stroke:#2dd4bf}.h{stroke:#fb923c}.b{stroke:#60a5fa}
.at{fill:#2dd4bf}.ht{fill:#fb923c}.bt{fill:#60a5fa}}
</style>
<text class="t" x="20" y="28">Put the answer back in both sides</text>
<text class="m" x="200" y="66" text-anchor="middle">x/4 + 3 = 5</text><text class="m" x="440" y="66" text-anchor="middle">try x = 8</text>
<rect class="fa" x="40" y="86" width="250" height="90" rx="10"/>
<text class="s" x="165" y="110" text-anchor="middle">left side</text><text class="m" x="165" y="140" text-anchor="middle">8/4 + 3</text><text class="at" x="165" y="164" text-anchor="middle">= 2 + 3 = 5</text>
<rect class="fb" x="350" y="86" width="250" height="90" rx="10"/>
<text class="s" x="475" y="110" text-anchor="middle">right side</text><text class="m" x="475" y="140" text-anchor="middle">5</text><text class="bt" x="475" y="164" text-anchor="middle">= 5</text>
<text class="m" x="320" y="136" text-anchor="middle">=</text>
<text class="at" x="320" y="212" text-anchor="middle">Both sides match, so x = 8 is correct ✔</text>
<text class="s" x="320" y="236" text-anchor="middle">If the sides differ, look for a term you forgot to multiply.</text>
</svg>
