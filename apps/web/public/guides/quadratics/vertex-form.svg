<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 275" width="600" height="275" role="img" aria-label="The parabola y = −2(x − 5)² + 39 opening down with its vertex (5, 39) at the top, the axis of symmetry x = 5, and the y-intercept (0, −11).">
