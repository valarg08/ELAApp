.ht{fill:#c2410c;font-weight:700}
.at{fill:#0f766e;font-weight:700}
.vt{fill:#6d28d9;font-weight:700}
.bt{fill:#1d4ed8;font-weight:700}
@media (prefers-color-scheme:dark){
.l,.d{stroke:#cbd5e1}.dot{fill:#cbd5e1}text{fill:#e2e8f0}.s{fill:#94a3b8}
.a{stroke:#2dd4bf}.h{stroke:#fb923c}.v{stroke:#a78bfa}.b{stroke:#60a5fa}
.g{stroke:#334155}.ax{stroke:#94a3b8}
.ht{fill:#fb923c}.at{fill:#2dd4bf}.vt{fill:#a78bfa}.bt{fill:#60a5fa}}
</style>
<text class="t" x="20" y="30" text-anchor="start">y = ax² + bx + c</text><text class="t" x="20" y="60" text-anchor="start">y = 2x² + 4x − 5</text><text x="20" y="96" text-anchor="start">a = 2   b = 4   c = −5</text><text class="at" x="20" y="122" text-anchor="start">a &gt; 0: opens up</text><text class="ht" x="20" y="148" text-anchor="start">c = −5: y-intercept (0, −5)</text><text class="s" x="20" y="190" text-anchor="start">a &lt; 0 would open down.</text><text class="s" x="20" y="210" text-anchor="start">Best way to graph it: make a table of values.</text><line class="g" x1="320" y1="20" x2="320" y2="250"/><line class="g" x1="355.7" y1="20" x2="355.7" y2="250"/><line class="g" x1="391.4" y1="20" x2="391.4" y2="250"/><line class="g" x1="427.1" y1="20" x2="427.1" y2="250"/><line class="ax" x1="462.9" y1="20" x2="462.9" y2="250"/><line class="g" x1="498.6" y1="20" x2="498.6" y2="250"/><line class="g" x1="534.3" y1="20" x2="534.3" y2="250"/><line class="g" x1="570" y1="20" x2="570" y2="250"/><line class="g" x1="320" y1="250" x2="570" y2="250"/><line class="g" x1="320" y1="229.1" x2="570" y2="229.1"/><line class="g" x1="320" y1="208.2" x2="570" y2="208.2"/><line class="g" x1="320" y1="187.3" x2="570" y2="187.3"/><line class="ax" x1="320" y1="166.4" x2="570" y2="166.4"/><line class="g" x1="320" y1="145.5" x2="570" y2="145.5"/><line class="g" x1="320" y1="124.5" x2="570" y2="124.5"/><line class="g" x1="320" y1="103.6" x2="570" y2="103.6"/><line class="g" x1="320" y1="82.7" x2="570" y2="82.7"/><line class="g" x1="320" y1="61.8" x2="570" y2="61.8"/><line class="g" x1="320" y1="40.9" x2="570" y2="40.9"/><line class="g" x1="320" y1="20" x2="570" y2="20"/><polyline class="a" fill="none" points="320,51.4 322.1,58.6 324.2,65.7 326.3,72.7 328.3,79.5 330.4,86.2 332.5,92.7 334.6,99.1 336.7,105.4 338.7,111.5 340.8,117.4 342.9,123.3 345,128.9 347.1,134.5 349.2,139.9 351.2,145.1 353.3,150.2 355.4,155.2 357.5,160 359.6,164.7 361.7,169.3 363.7,173.7 365.8,177.9 367.9,182 370,186 372.1,