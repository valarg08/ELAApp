<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 275" width="600" height="275" role="img" aria-label="The parabola y = 2x² + 4x − 5 opening up because a = 2, crossing the y-axis at (0, −5) because c = −5.">
<title>The parabola y = 2x² + 4x − 5 opening up because a = 2, crossing the y-axis at (0, −5) because c = −5.</title>
<style>
.l{stroke:#334155;stroke-width:2;fill:none;stroke-linejoin:round}
.d{stroke:#334155;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.a{stroke:#0d9488;stroke-width:3;fill:none;stroke-linejoin:round}
.h{stroke:#ea580c;stroke-width:3.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
