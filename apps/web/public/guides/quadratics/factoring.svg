<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 275" width="600" height="275" role="img" aria-label="Three ways to factor: a sum and product pair for x² + 11x + 24 giving (x + 8)(x + 3), splitting and grouping for 2x² + 7x − 4 giving (x + 4)(2x − 1), and the difference of squares x² − 9 = (x − 3)(x + 3).">
<title>Three ways to factor: a sum and product pair for x² + 11x + 24 giving (x + 8)(x + 3), splitting and grouping for 2x² + 7x − 4 giving (x + 4)(2x − 1), and the difference of squares x² − 9 = (x − 3)(x + 3).</title>
<style>
.l{stroke:#334155;stroke-width:2;fill:none;stroke-linejoin:round}
.d{stroke:#334155;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.a{stroke:#0d9488;stroke-width:3;fill:none;stroke-linejoin:round}
.h{stroke:#ea580c;stroke-width:3.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.v{stroke:#7c3aed;stroke-width:3;fill:none;stroke-linejoin:round}
.b{stroke:#2563eb;stroke-width:3;fill:none;stroke-linejoin:round}
.g{stroke:#cbd5e1;stroke-width:1}
.ax{stroke:#64748b;stroke-width:1.5}
.fa{fill:#0d9488;fill-opacity:.14}
.fh{fill:#ea580c;fill-opacity:.16}
.fv{fill:#7c3aed;fill-opacity:.12}
.fb{fill:#2563eb;fill-opacity:.12}
.dot{fill:#334155}
.dh{fill:#ea580c}
text{font:15px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#334155}
.t{font-weight:700;font-size:15px}
.s{font-size:13px;fill:#64748b}
.ht{fill:#c2410c;font-weight:700}
.at{fill:#0f766e;font-weight:700}
.vt{fill:#6d28d9;font-weight:700}
.bt{fill:#1d4ed8;font-weight:700}
@media (prefers-color-scheme:dark){
.l,.d{stroke:#cbd5e1}.dot{fill:#cbd5e1}text{fill:#e2e8f0}.s{fill:#94a3b8}
.a{stroke:#2dd4bf}.h{stroke:#fb923c}.v{stroke:#a78bfa}.b{stroke:#60a5fa}
.g{stroke:#334155}.ax{stroke:#94a3b8}
.ht{fill:#fb923c}.at{fill:#2dd4bf}.vt{fill:#a78bfa}.bt{fill:#60a5fa}}
</style>
<text class="t" x="20" y="24" text-anchor="start">Factoring three ways</text><rect class="fa" x="20" y="36" width="170" height="108" rx="8"/><text class="at" x="105" y="56" text-anchor="middle">x² + 11x + 24</text><text class="s" x="105" y="80" text-anchor="middle">product 24, sum 11</text><text x="105" y="102" text-anchor="middle">8 and 3</text><text class="at" x="105" y="128" text-anchor="middle">(x + 8)(x + 3)</text><rect class="fh" x="215" y="36" width="170" height="108" rx="8"/><text class="ht" x="300" y="56" text-anchor="middle">2x² + 7x − 4</text><text class="s" x="300" y="78" text-anchor="middle">product −8, sum 7: 8, −1</text><text x="300" y="98" text-anchor="middle">2x² + 8x − x − 4</text><text class="s" x="300" y="118" text-anchor="middle">2x(x + 4) − (x + 4)</text><text class="ht" x="300" y="138" text-anchor="middle">(x + 4)(2x − 1)</text><rect class="fv" x="410" y="36" width="170" height="108" rx="8"/><text class="vt" x="495" y="56" text-anchor="middle">x² − 9</text><text class="s" x="495" y="80" text-anchor="middle">9 = 3²</text><text class="s" x="495" y="102" text-anchor="middle">a² − b² = (a − b)(a + b)</text><text class="vt" x="495" y="128" text-anchor="middle">(x − 3)(x + 3)</text><text class="s" x="20" y="178" text-anchor="start">Always take out a common factor first:</text><text x="20" y="200" text-anchor="start">2x² − 2x − 24 = 2(x² − x − 12) = 2(x − 4)(x + 3)</text><text class="s" x="20" y="232" text-anchor="start">Check by expanding: the factors must multiply back to the original.</text>
</svg>
