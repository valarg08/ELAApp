<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 275" width="600" height="275" role="img" aria-label="The parabola y = 2x² − 12x + 10 with vertex (3, −8) found three ways: completing the square, averaging the x-intercepts 1 and 5, and using x = −b ÷ 2a.">
<title>The parabola y = 2x² − 12x + 10 with vertex (3, −8) found three ways: completing the square, averaging the x-intercepts 1 and 5, and using x = −b ÷ 2a.</title>
<style>
.l{stroke:#334155;stroke-width:2;fill:none;stroke-linejoin:round}
.d{stroke:#334155;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
