.g{stroke:#334155}.ax{stroke:#94a3b8}
.ht{fill:#fb923c}.at{fill:#2dd4bf}.vt{fill:#a78bfa}.bt{fill:#60a5fa}}
</style>
<text class="t" x="20" y="28" text-anchor="start">y = 2x² − 12x + 10</text><text class="at" x="20" y="58" text-anchor="start">1. Complete the square</text><text class="s" x="20" y="78" text-anchor="start">2(x² − 6x + 9) − 18 + 10</text><text x="20" y="96" text-anchor="start">= 2(x − 3)² − 8</text><text class="bt" x="20" y="126" text-anchor="start">2. Average the x-intercepts</text><text class="s" x="20" y="146" text-anchor="start">2(x − 1)(x − 5): (1 + 5) ÷ 2 = 3</text><text class="ht" x="20" y="176" text-anchor="start">3. x = −b ÷ 2a</text><text class="s" x="20" y="196" text-anchor="start">12 ÷ 4 = 3</text><text class="s" x="20" y="228" text-anchor="start">Then y = 2(9) − 36 + 10 = −8</text><text class="vt" x="20" y="250" text-anchor="start">vertex (3, −8)</text><line class="g" x1="330" y1="20" x2="330" y2="255"/><line class="ax" x1="360.6" y1="20" x2="360.6" y2="255"/><line class="g" x1="391.3" y1="20" x2="391.3" y2="255"/><line class="g" x1="421.9" y1="20" x2="421.9" y2="255"/><line class="g" x1="452.5" y1="20" x2="452.5" y2="255"/><line class="g" x1="483.1" y1="20" x2="483.1" y2="255"/><line class="g" x1="513.8" y1="20" x2="513.8" y2="255"/><line class="g" x1="544.4" y1="20" x2="544.4" y2="255"/><line class="g" x1="575" y1="20" x2="575" y2="255"/><line class="g" x1="330" y1="246" x2="575" y2="246"/><line class="ax" x1="330" y1="200.8" x2="575" y2="200.8"/><line class="g" x1="330" y1="155.6" x2="575" y2="155.6"/><line class="g" x1="330" y1="110.4" x2="575" y2="110.4"/><line class="g" x1="330" y1="65.2" x2="575" y2="65.2"/><line class="g" x1="330" y1="20" x2="575" y2="20"/><polyline class="v" fill="none" points="330,92.3 332,97.1 334.1,101.8 336.1,106.4 338.2,110.9 340.2,115.4 342.3,119.8 344.3,124.1 346.3,128.3 348.4,132.4 350.4,136.5 352.5,140.5 354.5,144.4 356.5,148.2 358.6,151.9 360.6,155.6 362.7,159.2 364.7,162.6 366.8,166.1 368.8,169.4 370.8,172.6 372.9,175.8 374.9,178.9 377,181.9 379,184.9 381,187.7 383.1,190.5 385.1,193.2 387.2,195.8 389.2,198.3 391.3,200.