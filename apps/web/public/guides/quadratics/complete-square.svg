<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 275" width="600" height="275" role="img" aria-label="An area model for completing the square: the square (x − 3)² plus two strips of 3 and a corner of 9 make up x², leading from x² − 6x − 8 = 0 to (x − 3)² = 17 and x = 3 ± √17.">
<title>An area model for completing the square: the square (x − 3)² plus two strips of 3 and a corner of 9 make up x², leading from x² − 6x − 8 = 0 to (x − 3)² = 17 and x = 3 ± √17.</title>
<style>
.l{stroke:#334155;stroke-width:2;fill:none;stroke-linejoin:round}
.d{stroke:#334155;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.a{stroke:#0d9488;stroke-width:3;fill:none;stroke-linejoin:round}
.h{stroke:#ea580c;stroke-width:3.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.v{stroke:#7c3aed;stroke-width:3;fill:none;stroke-linejoin:round}
.b{stroke:#2563eb;stroke-width:3;fill:none;stroke-linejoin:round}
.g{stroke:#cbd5e1;stroke-width:1}
.ax{stroke:#64748b;stroke-width:1.5}
.fa{fill:#0d9488;fill-opacity:.14}
.fh{fill:#ea580c;fill-opacity:.16}
.fv{fill:#7c3aed;fill-opacity:.12}
.fb{fill:#2563eb;fill-opacity:.12}
.dot{fill:#334155}
.dh{fill:#ea580c}
text{font:15px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#334155}
.t{font-weight:700;font-size:15px}
.s{font-size:13px;fill:#64748b}
.ht{fill:#c2410c;font-weight:700}
.at{fill:#0f766e;font-weight:700}
.vt{fill:#6d28d9;font-weight:700}
.bt{fill:#1d4ed8;font-weight:700}
@media (prefers-color-scheme:dark){
.l,.d{stroke:#cbd5e1}.dot{fill:#cbd5e1}text{fill:#e2e8f0}.s{fill:#94a3b8}
.a{stroke:#2dd4bf}.h{stroke:#fb923c}.v{stroke:#a78bfa}.b{stroke:#60a5fa}
.g{stroke:#334155}.ax{stroke:#94a3b8}
.ht{fill:#fb923c}.at{fill:#2dd4bf}.vt{fill:#a78bfa}.bt{fill:#60a5fa}}
</style>
<text class="t" x="20" y="28" text-anchor="start">Solve x² − 6x − 8 = 0</text><rect class="fb" x="30" y="46" width="150" height="150" /><rect class="l" x="30" y="46" width="150" height="150"/><rect class="fh" x="30" y="46" width="105" height="105"/><rect class="l" x="30" y="46" width="105" height="105"/><text class="ht" x="82" y="104" text-anchor="middle">(x − 3)²</text><text class="s" x="157" y="104" text-anchor="middle">3</text><text class="s" x="82" y="176" text-anchor="middle">3</text><text class="s" x="157" y="176" text-anchor="middle">9</text><text class="s" x="105" y="214" text-anchor="middle">x</text><text class="s" x="18" y="124" text-anchor="start">x</text><text class="s" x="20" y="236" text-anchor="start">x² − 6x + 9 = (x − 3)²</text><text class="s" x="20" y="254" text-anchor="start">adding 9 makes a square</text><text x="220" y="60" text-anchor="start">x² − 6x = 8</text><text x="220" y="86" text-anchor="start">x² − 6x + 9 = 8 + 9</text><text class="ht" x="220" y="112" text-anchor="start">(x − 3)² = 17</text><text x="220" y="138" text-anchor="start">x − 3 = ±√17</text><text class="vt" x="220" y="164" text-anchor="start">x = 3 ± √17</text><text class="s" x="220" y="212" text-anchor="start">Add half the x-coefficient squared</text><text class="s" x="220" y="232" text-anchor="start">to both sides: (−6 ÷ 2)² = 9.</text>
</svg>
