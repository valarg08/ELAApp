<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 275" width="600" height="275" role="img" aria-label="The parabola y = 2x² − 2x − 24 crossing the x-axis at x = −3 and x = 4, the two solutions found by factoring 2(x − 4)(x + 3) = 0.">
