<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 275" width="600" height="275" role="img" aria-label="The quadratic formula x = (−b ± √(b² − 4ac)) ÷ 2a, with the example x² − 6x − 8 = 0 giving x = 3 ± √17.">
<title>The quadratic formula x = (−b ± √(b² − 4ac)) ÷ 2a, with the example x² − 6x − 8 = 0 giving x = 3 ± √17.</title>
<style>
.l{stroke:#334155;stroke-width:2;fill:none;stroke-linejoin:round}
.d{stroke:#334155;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.a{stroke:#0d9488;stroke-width:3;fill:none;stroke-linejoin:round}
.h{stroke:#ea580c;stroke-width:3.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.v{stroke:#7c3aed;stroke-width:3;fill:none;stroke-linejoin:round}
.b{stroke:#2563eb;stroke-width:3;fill:none;stroke-linejoin:round}
.g{stroke:#cbd5e1;stroke-width:1}
.ax{stroke:#64748b;stroke-width:1.5}
.fa{fill:#0d9488;fill-opacity:.14}
.fh{fill:#ea580c;fill-opacity:.16}
.fv{fill:#7c3aed;fill-opacity:.12}
.fb{fill:#2563eb;fill-opacity:.12}
.dot{fill:#334155}
.dh{fill:#ea580c}
text{font:15px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#334155}
.t{font-weight:700;font-size:15px}
.s{font-size:13px;fill:#64748b}
.ht{fill:#c2410c;font-weight:700}
.at{fill:#0f766e;font-weight:700}
.vt{fill:#6d28d9;font-weight:700}
.bt{fill:#1d4ed8;font-weight:700}
@media (prefers-color-scheme:dark){
.l,.d{stroke:#cbd5e1}.dot{fill:#cbd5e1}text{fill:#e2e8f0}.s{fill:#94a3b8}
.a{stroke:#2dd4bf}.h{stroke:#fb923c}.v{stroke:#a78bfa}.b{stroke:#60a5fa}
.g{stroke:#334155}.ax{stroke:#94a3b8}
.ht{fill:#fb923c}.at{fill:#2dd4bf}.vt{fill:#a78bfa}.bt{fill:#60a5fa}}
</style>
<text class="t" x="20" y="30" text-anchor="start">ax² + bx + c = 0</text><text class="ht" x="20" y="78" text-anchor="start">x =</text><text class="ht" x="60" y="66" text-anchor="start">−b ± √(b² − 4ac)</text><line class="h" x1="58" y1="76" x2="215" y2="76"/><text class="ht" x="137" y="98" text-anchor="middle">2a</text><text class="t" x="20" y="140" text-anchor="start">Example: x² − 6x − 8 = 0</text><text class="s" x="20" y="164" text-anchor="start">a = 1, b = −6, c = −8</text><text x="20" y="190" text-anchor="start">x = (6 ± √(36 + 32)) ÷ 2</text><text x="20" y="212" text-anchor="start">x = (6 ± 2√17) ÷ 2</text><text class="vt" x="20" y="236" text-anchor="start">x = 3 ± √17</text><text class="s" x="330" y="66" text-anchor="start">It comes from completing the</text><text class="s" x="330" y="86" text-anchor="start">square on the general quadratic.</text><text class="at" x="330" y="130" text-anchor="start">Steps:</text><text class="s" x="330" y="154" text-anchor="start">1. Set the equation equal to 0</text><text class="s" x="330" y="178" text-anchor="start">2. Read a, b and c with signs</text><text class="s" x="330" y="202" text-anchor="start">3. Work out b² − 4ac first</text><text class="s" x="330" y="226" text-anchor="start">4. Simplify the root, then divide</text>
</svg>
