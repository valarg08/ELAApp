<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-label="Brackets matter for a negative base. Negative 5, cubed, in brackets is minus 125; negative 5, squared, in brackets is positive 25; but minus 5 squared without brackets is minus 25 because the exponent is only on the 5.">
<title>Brackets matter for a negative base. Negative 5, cubed, in brackets is minus 125; negative 5, squared, in brackets is positive 25; but minus 5 squared without brackets is minus 25 because the exponent is only on the 5.</title>
<style>
.l{stroke:#334155;stroke-width:2;fill:none;stroke-linejoin:round}
.d{stroke:#64748b;stroke-width:1.5;fill:none;stroke-dasharray:6 5}
.a{stroke:#0d9488;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.h{stroke:#ea580c;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.b{stroke:#2563eb;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fa{fill:#0d9488;fill-opacity:.15}
.fh{fill:#ea580c;fill-opacity:.14}
.fb{fill:#2563eb;fill-opacity:.12}
text{font:17px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#334155}
.t{font-weight:700;font-size:16px}
.s{font-size:14px;fill:#64748b}
.m{font-size:22px}
.big{font-size:34px;font-weight:600}
.huge{font-size:72px;font-weight:700}
.at{fill:#0f766e;font-weight:700}
.ht{fill:#c2410c;font-weight:700}
.bt{fill:#1d4ed8;font-weight:700}
@media (prefers-color-scheme:dark){
.l{stroke:#cbd5e1}.d{stroke:#94a3b8}text{fill:#e2e8f0}.s{fill:#94a3b8}
.a{stroke:#2dd4bf}.h{stroke:#fb923c}.b{stroke:#60a5fa}
.at{fill:#2dd4bf}.ht{fill:#fb923c}.bt{fill:#60a5fa}}
</style>
<text class="t" x="20" y="28">Where is the negative?</text>
<rect class="fa" x="30" y="50" width="180" height="110" rx="10"/>
<text class="m" x="120" y="88" text-anchor="middle">(−5)³</text>
<text class="s" x="120" y="112" text-anchor="middle">−5 × −5 × −5</text>
<text class="big" x="120" y="148" text-anchor="middle">−125</text>
<rect class="fh" x="230" y="50" width="180" height="110" rx="10"/>
<text class="m" x="320" y="88" text-anchor="middle">(−5)²</text>
<text class="s" x="320" y="112" text-anchor="middle">−5 × −5</text>
<text class="big" x="320" y="148" text-anchor="middle">25</text>
<rect class="fb" x="430" y="50" width="180" height="110" rx="10"/>
<text class="m" x="520" y="88" text-anchor="middle">−5²</text>
<text class="s" x="520" y="112" text-anchor="middle">−1 × (5 × 5)</text>
<text class="big" x="520" y="148" text-anchor="middle">−25</text>
<text class="at" x="120" y="186" text-anchor="middle">odd exponent</text>
<text class="ht" x="320" y="186" text-anchor="middle">even exponent</text>
<text class="bt" x="520" y="186" text-anchor="middle">no bracket</text>
<text class="s" x="320" y="226" text-anchor="middle">In brackets: even exponent gives +, odd exponent gives −.</text>
</svg>
