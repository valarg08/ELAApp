<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-label="The rule for scientific notation a times 10 to the n: a is at least 1 and less than 10, and n is a whole number. 3.2 times 10 to the 5 is correct. 32 times 10 to the 4 has a coefficient that is too big. 0.32 times 10 to the 6 has a coefficient that is too small.">
<title>The rule for scientific notation a times 10 to the n: a is at least 1 and less than 10, and n is a whole number. 3.2 times 10 to the 5 is correct. 32 times 10 to the 4 has a coefficient that is too big. 0.32 times 10 to the 6 has a coefficient that is too small.</title>
<style>
.l{stroke:#334155;stroke-width:2;fill:none;stroke-linejoin:round}
.d{stroke:#64748b;stroke-width:1.5;fill:none;stroke-dasharray:6 5}
.a{stroke:#0d9488;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.h{stroke:#ea580c;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.b{stroke:#2563eb;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fa{fill:#0d9488;fill-opacity:.15}
.fh{fill:#ea580c;fill-opacity:.14}
.fb{fill:#2563eb;fill-opacity:.12}
text{font:17px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#334155}
.t{font-weight:700;font-size:16px}
.s{font-size:14px;fill:#64748b}
.m{font-size:22px}
.big{font-size:34px;font-weight:600}
.huge{font-size:72px;font-weight:700}
.at{fill:#0f766e;font-weight:700}
.ht{fill:#c2410c;font-weight:700}
.bt{fill:#1d4ed8;font-weight:700}
@media (prefers-color-scheme:dark){
.l{stroke:#cbd5e1}.d{stroke:#94a3b8}text{fill:#e2e8f0}.s{fill:#94a3b8}
.a{stroke:#2dd4bf}.h{stroke:#fb923c}.b{stroke:#60a5fa}
.at{fill:#2dd4bf}.ht{fill:#fb923c}.bt{fill:#60a5fa}}
</style>
<text class="t" x="20" y="28">a × 10ⁿ  with  1 ≤ a &lt; 10  and  n a whole number</text>
<rect class="fa" x="30" y="58" width="180" height="96" rx="10"/>
<text class="big" x="120" y="102" text-anchor="middle">3.2 × 10⁵</text>
<text class="at" x="120" y="136" text-anchor="middle">✔ one digit first</text>
<rect class="fh" x="230" y="58" width="180" height="96" rx="10"/>
<text class="big" x="320" y="102" text-anchor="middle">32 × 10⁴</text>
<text class="ht" x="320" y="136" text-anchor="middle">✘ 32 is 10 or more</text>
<rect class="fb" x="430" y="58" width="180" height="96" rx="10"/>
<text class="big" x="520" y="102" text-anchor="middle">0.32 × 10⁶</text>
<text class="bt" x="520" y="136" text-anchor="middle">✘ 0.32 is below 1</text>
<text class="s" x="320" y="190" text-anchor="middle">All three are the same number, 320,000. Only the first is in scientific notation.</text>
<text class="s" x="320" y="214" text-anchor="middle">Big numbers have a positive n. Numbers between 0 and 1 have a negative n.</text>
</svg>
