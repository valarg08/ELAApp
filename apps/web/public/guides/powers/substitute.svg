<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-label="Substituting a negative value. For 4x squared plus 3x when x is minus 2, replace x with minus 2 in brackets: 4 times (minus 2) squared plus 3 times (minus 2) is 16 minus 6, which is 10. Without brackets, minus 2 squared would wrongly look like minus 4.">
<title>Substituting a negative value. For 4x squared plus 3x when x is minus 2, replace x with minus 2 in brackets: 4 times (minus 2) squared plus 3 times (minus 2) is 16 minus 6, which is 10. Without brackets, minus 2 squared would wrongly look like minus 4.</title>
<style>
.l{stroke:#334155;stroke-width:2;fill:none;stroke-linejoin:round}
.d{stroke:#64748b;stroke-width:1.5;fill:none;stroke-dasharray:6 5}
.a{stroke:#0d9488;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.h{stroke:#ea580c;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.b{stroke:#2563eb;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fa{fill:#0d9488;fill-opacity:.15}
.fh{fill:#ea580c;fill-opacity:.14}
.fb{fill:#2563eb;fill-opacity:.12}
text{font:17px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#334155}
.t{font-weight:700;font-size:16px}
.s{font-size:14px;fill:#64748b}
.m{font-size:22px}
.big{font-size:34px;font-weight:600}
.huge{font-size:72px;font-weight:700}
.at{fill:#0f766e;font-weight:700}
.ht{fill:#c2410c;font-weight:700}
.bt{fill:#1d4ed8;font-weight:700}
@media (prefers-color-scheme:dark){
.l{stroke:#cbd5e1}.d{stroke:#94a3b8}text{fill:#e2e8f0}.s{fill:#94a3b8}
.a{stroke:#2dd4bf}.h{stroke:#fb923c}.b{stroke:#60a5fa}
.at{fill:#2dd4bf}.ht{fill:#fb923c}.bt{fill:#60a5fa}}
</style>
<text class="t" x="20" y="28">Substitute with brackets</text>
<text class="m" x="320" y="70" text-anchor="middle">4x² + 3x    when x = −2</text>
<rect class="fa" x="40" y="92" width="560" height="62" rx="10"/>
<text class="m" x="320" y="132" text-anchor="middle">4(−2)² + 3(−2)</text>
<text class="s" x="320" y="172" text-anchor="middle">power first: (−2)² = 4</text>
<text class="s" x="320" y="190" text-anchor="middle">then multiply: 4 × 4 = 16 and 3 × (−2) = −6</text>
<text class="big at" x="320" y="228" text-anchor="middle">16 − 6 = 10</text>
<text class="s" x="320" y="246" text-anchor="middle">Without brackets, −2² would look like −4. The bracket keeps the exponent on −2.</text>
</svg>
