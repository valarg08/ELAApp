<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-label="A table of powers of 3 from 3 cubed down to 3 to the minus 2. Each step down divides the value by 3: 27, 9, 3, then 3 to the 0 equals 1, then 1 over 3, then 1 over 9. A zero exponent gives 1, and a negative exponent gives a reciprocal.">
<title>A table of powers of 3 from 3 cubed down to 3 to the minus 2. Each step down divides the value by 3: 27, 9, 3, then 3 to the 0 equals 1, then 1 over 3, then 1 over 9. A zero exponent gives 1, and a negative exponent gives a reciprocal.</title>
<style>
.l{stroke:#334155;stroke-width:2;fill:none;stroke-linejoin:round}
.d{stroke:#64748b;stroke-width:1.5;fill:none;stroke-dasharray:6 5}
.a{stroke:#0d9488;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.h{stroke:#ea580c;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.b{stroke:#2563eb;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fa{fill:#0d9488;fill-opacity:.15}
.fh{fill:#ea580c;fill-opacity:.14}
.fb{fill:#2563eb;fill-opacity:.12}
text{font:17px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#334155}
.t{font-weight:700;font-size:16px}
.s{font-size:14px;fill:#64748b}
.m{font-size:22px}
.big{font-size:34px;font-weight:600}
.huge{font-size:72px;font-weight:700}
.at{fill:#0f766e;font-weight:700}
.ht{fill:#c2410c;font-weight:700}
.bt{fill:#1d4ed8;font-weight:700}
@media (prefers-color-scheme:dark){
.l{stroke:#cbd5e1}.d{stroke:#94a3b8}text{fill:#e2e8f0}.s{fill:#94a3b8}
.a{stroke:#2dd4bf}.h{stroke:#fb923c}.b{stroke:#60a5fa}
.at{fill:#2dd4bf}.ht{fill:#fb923c}.bt{fill:#60a5fa}}
</style>
<text class="t" x="20" y="28">Each step down divides by 3</text><rect class="fa" x="40" y="70" width="90" height="90" rx="8"/><text class="m" x="85" y="105" text-anchor="middle">3³</text><text class="big" x="85" y="145" text-anchor="middle">27</text><text class="s" x="134" y="62" text-anchor="middle">÷3</text><rect class="fa" x="138" y="70" width="90" height="90" rx="8"/><text class="m" x="183" y="105" text-anchor="middle">3²</text><text class="big" x="183" y="145" text-anchor="middle">9</text><text class="s" x="232" y="62" text-anchor="middle">÷3</text><rect class="fa" x="236" y="70" width="90" height="90" rx="8"/><text class="m" x="281" y="105" text-anchor="middle">3¹</text><text class="big" x="281" y="145" text-anchor="middle">3</text><text class="s" x="330" y="62" text-anchor="middle">÷3</text><rect class="fh" x="334" y="70" width="90" height="90" rx="8"/><text class="m" x="379" y="105" text-anchor="middle">3⁰</text><text class="big" x="379" y="145" text-anchor="middle">1</text><text class="s" x="428" y="62" text-anchor="middle">÷3</text><rect class="fb" x="432" y="70" width="90" height="90" rx="8"/><text class="m" x="477" y="105" text-anchor="middle">3⁻¹</text><text class="big" x="477" y="145" text-anchor="middle">1/3</text><text class="s" x="526" y="62" text-anchor="middle">÷3</text><rect class="fb" x="530" y="70" width="90" height="90" rx="8"/><text class="m" x="575" y="105" text-anchor="middle">3⁻²</text><text class="big" x="575" y="145" text-anchor="middle">1/9</text><text class="ht" x="379" y="190" text-anchor="middle">x⁰ = 1</text><text class="bt" x="477" y="190" text-anchor="middle">x⁻ⁿ = 1/xⁿ</text><text class="s" x="320" y="232" text-anchor="middle">Keep dividing by 3: the exponent drops by 1 and the value is cut to a third.</text>
</svg>
