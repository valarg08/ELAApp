<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" role="img" aria-label="Rectangle 8 by 4 centimetres with area 32 and perimeter 24; circle of radius 3 inches with area 9 pi and circumference 6 pi">
<title>Rectangle 8 by 4 centimetres with area 32 and perimeter 24; circle of radius 3 inches with area 9 pi and circumference 6 pi</title>
<style>
.l{stroke:#334155;stroke-width:2;fill:none;stroke-linejoin:round}
