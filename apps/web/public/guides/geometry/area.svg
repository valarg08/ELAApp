<text class="t" x="160" y="22" text-anchor="middle">Rectangle</text><rect class="l fa" x="60" y="50" width="200" height="100"/><text x="160" y="172" text-anchor="middle">8 cm</text><text x="52" y="105" text-anchor="end">4 cm</text><text class="at" x="160" y="205" text-anchor="middle">A = 8 × 4 = 32 cm²</text><text class="ht" x="160" y="228" text-anchor="middle">P = 2(8) + 2(4) = 24 cm</text><text class="t" x="420" y="22" text-anchor="middle">Circle</text><circle class="l fa" cx="420" cy="110" r="70"/><line class="h" x1="420" y1="110" x2="490" y2="110"/><circle class="dot" cx="420" cy="110" r="4"/><text class="ht" x="455" y="102" text-anchor="middle">r = 3 in</text><text class="at" x="420" y="205" text-anchor="middle">A = πr² = 9π ≈ 28.3 in²</text><text class="ht" x="420" y="228" text-anchor="middle">C = 2πr = 6π ≈ 18.8 in</text><text class="s" x="560" y="90" text-anchor="start">Area: units²</text><text class="s" x="560" y="112" text-anchor="start">Perimeter: units</text><text class="s" x="560" y="134" text-anchor="start">Given d? r = d ÷ 2</text>
