<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Points A(-2, 4) and B(6, -4) on a grid with midpoint M(2, 0) and the right triangle that gives the distance">
<title>Points A(-2, 4) and B(6, -4) on a grid with midpoint M(2, 0) and the right triangle that gives the distance</title>
<style>
.l{stroke:#334155;stroke-width:2;fill:none;stroke-linejoin:round}
.d{stroke:#334155;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.a{stroke:#0d9488;stroke-width:3;fill:none;stroke-linejoin:round}
.h{stroke:#ea580c;stroke-width:3.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.v{stroke:#7c3aed;stroke-width:3;fill:none;stroke-linejoin:round}
.b{stroke:#2563eb;stroke-width:3;fill:none;stroke-linejoin:round}
.g{stroke:#cbd5e1;stroke-width:1}
.ax{stroke:#64748b;stroke-width:1.5}
.fa{fill:#0d9488;fill-opacity:.14}
.fh{fill:#ea580c;fill-opacity:.16}
.fv{fill:#7c3aed;fill-opacity:.12}
.fb{fill:#2563eb;fill-opacity:.12}
.dot{fill:#334155}
text{font:15px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#334155}
.t{font-weight:700;font-size:15px}
.s{font-size:13px;fill:#64748b}
.ht{fill:#c2410c;font-weight:700}
.at{fill:#0f766e;font-weight:700}
.vt{fill:#6d28d9;font-weight:700}
.bt{fill:#1d4ed8;font-weight:700}
@media (prefers-color-scheme:dark){
.l,.d{stroke:#cbd5e1}.dot{fill:#cbd5e1}text{fill:#e2e8f0}.s{fill:#94a3b8}
.a{stroke:#2dd4bf}.h{stroke:#fb923c}.v{stroke:#a78bfa}.b{stroke:#60a5fa}
.g{stroke:#334155}.ax{stroke:#94a3b8}
.ht{fill:#fb923c}.at{fill:#2dd4bf}.vt{fill:#a78bfa}.bt{fill:#60a5fa}}
</style>
<line class="g" x1="25" y1="25" x2="25" y2="275"/><line class="g" x1="50" y1="25" x2="50" y2="275"/><line class="g" x1="75" y1="25" x2="75" y2="275"/><line class="ax" x1="100" y1="25" x2="100" y2="275"/><line class="g" x1="125" y1="25" x2="125" y2="275"/><line class="g" x1="150" y1="25" x2="150" y2="275"/><line class="g" x1="175" y1="25" x2="175" y2="275"/><line class="g" x1="200" y1="25" x2="200" y2="275"/><line class="g" x1="225" y1="25" x2="225" y2="275"/><line class="g" x1="250" y1="25" x2="250" y2="275"/><line class="g" x1="275" y1="25" x2="275" y2="275"/><line class="g" x1="25" y1="275" x2="275" y2="275"/><line class="g" x1="25" y1="250" x2="275" y2="250"/><line class="g" x1="25" y1="225" x2="275" y2="225"/><line class="g" x1="25" y1="200" x2="275" y2="200"/><line class="g" x1="25" y1="175" x2="275" y2="175"/><line class="ax" x1="25" y1="150" x2="275" y2="150"/><line class="g" x1="25" y1="125" x2="275" y2="125"/><line class="g" x1="25" y1="100" x2="275" y2="100"/><line class="g" x1="25" y1="75" x2="275" y2="75"/><line class="g" x1="25" y1="50" x2="275" y2="50"/><line class="g" x1="25" y1="25" x2="275" y2="25"/><line class="h" x1="50" y1="50" x2="50" y2="250"/><line class="h" x1="50" y1="250" x2="250" y2="250"/><line class="a" x1="50" y1="50" x2="250" y2="250"/><text class="ht" x="42" y="205" text-anchor="end">8</text><text class="ht" x="150" y="270" text-anchor="middle">8</text><circle class="dot" cx="50" cy="50" r="5"/><circle class="dot" cx="250" cy="250" r="5"/><circle class="dot" cx="150" cy="150" r="5"/><text class="t" x="60" y="44" text-anchor="start">A(−2, 4)</text><text class="t" x="254" y="236" text-anchor="start">B(6, −4)</text><text class="at" x="160" y="142" text-anchor="start">M(2, 0)</text><text class="t" x="300" y="60" text-anchor="start">Midpoint: average the coordinates</text><text x="300" y="84" text-anchor="start">M = ((−2 + 6)/2, (4 − 4)/2) = (2, 0)</text><text class="t" x="300" y="130" text-anchor="start">Distance: Pythagoras on the gaps</text><text x="300" y="154" text-anchor="start">gaps 8 and 8 (orange legs)</text><text x="300" y="178" text-anchor="start">AB = √(8² + 8²) = √128 = 8√2 ≈ 11.3</text>
