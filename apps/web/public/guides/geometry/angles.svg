<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 235" width="960" height="235" role="img" aria-label="Parallel lines cut by a transversal: Z angles equal, C angles add to 180 degrees, F angles equal; vertical angles equal">
<title>Parallel lines cut by a transversal: Z angles equal, C angles add to 180 degrees, F angles equal; vertical angles equal</title>
<style>
.l{stroke:#334155;stroke-width:2;fill:none;stroke-linejoin:round}
