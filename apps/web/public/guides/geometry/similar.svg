<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 265" width="640" height="265" role="img" aria-label="Similar triangles with scale factor 2, and the bow-tie: AB parallel to DE makes triangle ABC similar to triangle DEC">
<title>Similar triangles with scale factor 2, and the bow-tie: AB parallel to DE makes triangle ABC similar to triangle DEC</title>
<style>
.l{stroke:#334155;stroke-width:2;fill:none;stroke-linejoin:round}
