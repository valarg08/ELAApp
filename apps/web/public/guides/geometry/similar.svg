</style>
<text class="t" x="180" y="22" text-anchor="middle">Same shape, sides scaled by k</text><polygon class="l fa" points="30,200 110,200 50,140"/><polygon class="l fa" points="170,200 330,200 210,80"/><path class="h" d="M44,200 A14,14 0 0 0 34.4,186.7"/><path class="h" d="M190,200 A20,20 0 0 0 176.3,181"/><path class="a" d="M96,200 A14,14 0 0 1 100.1,190.1"/><path class="a" d="M310,200 A20,20 0 0 1 315.9,185.9"/><text x="70" y="222" text-anchor="middle">4</text><text x="250" y="222" text-anchor="middle">8</text><text class="ht" x="180" y="250" text-anchor="middle">k = 8 ÷ 4 = 2</text><text class="s" x="40" y="205" text-anchor="end">A</text><text class="s" x="120" y="205" text-anchor="start">B</text><text class="s" x="50" y="132" text-anchor="middle">C</text><text class="s" x="160" y="205" text-anchor="end">D</text><text class="s" x="340" y="205" text-anchor="start">E</text><text class="s" x="210" y="72" text-anchor="middle">F</text><text class="t" x="490" y="22" text-anchor="middle">Bow-tie: AB parallel to DE</text><line class="l" x1="430" y1="60" x2="550" y2="60"/><line class="l" x1="400" y1="210" x2="580" y2="210"/><line class="l" x1="430" y1="60" x2="580" y2="210"/><line class="l" x1="550" y1="60" x2="400" y2="210"/><path class="l" d="M485,54 L493,60 L485,66"/><path class="l" d="M485,204 L493,210 L485,216"/><path class="h" d="M448,60 A18,18 0 0 1 442.7,72.7"/><path class="h" d="M562,210 A18,18 0 0 1 567.3,197.3"/><path class="a" d="M532,60 A18,18 0 0 0 537.3,72.7"/><path class="a" d="M418,210 A18,18 0 0 0 412.7,197.3"/><text x="424" y="56" text-anchor="end">A</text><text x="556" y="56" text-anchor="start">B</text><text x="490" y="105" text-anchor="middle">C</text><text x="586" y="226" text-anchor="start">D</text><text x="394" y="226" text-anchor="end">E</text><text class="ht" x="490" y="250" text-anchor="middle">△ABC ~ △DEC by AA</text>
