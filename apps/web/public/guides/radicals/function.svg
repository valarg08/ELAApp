<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-label="The graph of y equals the square root of x: it starts at the origin, passes through (1, 1), (4, 2) and (9, 3), and rises ever more slowly. The domain is x greater than or equal to 0.">
<title>The graph of y equals the square root of x: it starts at the origin, passes through (1, 1), (4, 2) and (9, 3), and rises ever more slowly. The domain is x greater than or equal to 0.</title>
<style>
.l{stroke:#334155;stroke-width:2;fill:none;stroke-linejoin:round}
.d{stroke:#334155;stroke-width:2;fill:none;stroke-dasharray:6 5}
.a{stroke:#0d9488;stroke-width:3;fill:none;stroke-linecap:round}
.h{stroke:#ea580c;stroke-width:3.5;fill:none;stroke-linecap:round}
