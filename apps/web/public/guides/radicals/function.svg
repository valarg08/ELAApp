.a{stroke:#2dd4bf}.h{stroke:#fb923c}.b{stroke:#60a5fa}.v{stroke:#a78bfa}
.g{stroke:#334155}.ax{stroke:#94a3b8}
.at{fill:#2dd4bf}.ht{fill:#fb923c}.bt{fill:#60a5fa}.vt{fill:#a78bfa}}
</style>
<text class="t" x="20" y="24">y = √x</text>
